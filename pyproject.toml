[project]
name = "sges-simulator"
version = "0.1.0"
description = "Simulator for Solid Gravity Energy Storage systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27"
]

[project.scripts]
sges = "sges.cli.main:app"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
